<script>
// Preserve explicit campaign attribution. Only untagged outreach links get
// email defaults; content-only variants still belong to the outreach campaign.
var destination = new URL("https://ccc.amirfish.ai/");
destination.search = location.search;
destination.hash = location.hash;
var campaign = destination.searchParams;
if (!["utm_source", "utm_medium", "utm_campaign"].some(function (key) {
  return campaign.has(key);
})) {
  campaign.set("utm_source", "email");
  campaign.set("utm_medium", "outreach");
  campaign.set("utm_campaign", "gh-leadgen");
}
location.replace(destination.href);
</script>
<p>Redirecting to <a href="https://ccc.amirfish.ai/">CCC</a>&hellip;</p>
